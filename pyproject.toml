[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toronto-rent-heatmap-lab"
version = "0.1.0"
description = "Python ETL and SQL warehouse assets for a Toronto rent heatmap dashboard."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "XXStvXX" }]
dependencies = [
    "duckdb>=1.0",
    "geopandas>=0.14",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
rent-heatmap = "rent_heatmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
